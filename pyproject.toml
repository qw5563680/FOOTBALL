[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zucai"
version = "0.1.0"
description = "中国足彩比赛分析与预测"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "zstandard>=0.22",
    "lxml>=5.0",
    "sqlalchemy>=2.0",
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
model = ["penaltyblog==1.13.1"]
features = ["pyarrow>=14"]
dev = [
    "zucai[model,features]",
    "pytest>=7.4",
    "ruff>=0.4",
    "responses>=0.25",
]

[project.scripts]
zucai = "zucai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
