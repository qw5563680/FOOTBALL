name: Football cloud feeds
on:
  schedule:
    - cron: '40 2 * * *'
    - cron: '40 9 * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: 'apis 日常采集，sync 竞彩，verify 校验，predict 预测，backfill 历史回填，scoreboard 记分板，probe 权限探测，identity 身份核验'
        type: choice
        options: [apis, sync, verify, predict, backfill, scoreboard, probe, identity]
        default: verify
      source:
        description: 'backfill 来源；probe / identity 固定使用 apif'
        type: choice
        options: [fd, fdorg, apif]
        default: fd
      leagues:
        description: '赛事代码；留空按操作选择：赛季 probe 用 3,848，身份核验/元数据 probe 用七个桥接联赛'
        type: string
        default: ''
      seasons:
        description: 'probe 年份；identity 留空为 2025,2026'
        type: string
        default: ''
      probe_kind:
        description: '仅 probe：seasons 查赛季权限，leagues 确认七个桥接联赛 ID'
        type: choice
        options: [seasons, leagues]
        default: seasons
      from_season:
        description: '仅 backfill：起始年或 fd 赛季代码，留空用已核验范围'
        type: string
        default: ''
      to_season:
        description: '仅 backfill：终止年或 fd 赛季代码，留空用已核验范围'
        type: string
        default: ''
      days:
        description: 'fdorg 前后各 N 个 UTC 日；sync 回看 N 个北京时间自然日'
        type: number
        default: 3
      slot:
        description: 'fd 仅 UTC 周一 early 运行；auto 按 UTC 09:00 分早晚'
        type: choice
        options: [auto, early, late]
        default: auto
  push:
    tags: ['football-ingest-run-*', 'football-ingest-verify-*']

permissions:
  contents: write
# One lock covers collection and prediction, including dispatches from different branches.
concurrency:
  group: write-football-feed-data
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  FEED_MODE: ${{ (github.event_name == 'workflow_dispatch' && inputs.operation == 'identity') && 'identity' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'probe') && 'probe' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'backfill') && 'backfill' || ((startsWith(github.ref_name, 'football-ingest-verify-') || inputs.operation == 'verify') && 'verify' || ((startsWith(github.ref_name, 'football-ingest-run-') || inputs.operation == 'sync') && 'sync' || 'apis')) }}

jobs:
  apis:
    if: ${{ github.event_name == 'schedule' || inputs.operation == 'apis' || inputs.operation == 'verify' || (github.event_name == 'workflow_dispatch' && (inputs.operation == 'backfill' || inputs.operation == 'probe' || inputs.operation == 'identity')) || (inputs.operation != 'scoreboard' && startsWith(github.ref_name, 'football-ingest-verify-')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WORK_DIR: work-apis-${{ github.run_id }}-${{ github.run_attempt }}
      ZUCAI_APIF_DAILY_CAP: ${{ vars.ZUCAI_APIF_DAILY_CAP }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        if: ${{ env.FEED_MODE != 'sync' }}
        with:
          ref: data/football-feeds
          path: cloud-data
          fetch-depth: 0
      - name: Install project with checked-in source configurations
        if: ${{ env.FEED_MODE != 'sync' }}
        run: python -m pip install -e ./app
      - name: Restore and collect APIs or verify archive
        if: ${{ env.FEED_MODE != 'sync' && env.FEED_MODE != 'backfill' && env.FEED_MODE != 'probe' && env.FEED_MODE != 'identity' }}
        env:
          FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_TOKEN }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          LOOKBACK: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.days) || '3' }}
          FEED_SLOT: ${{ github.event_name == 'schedule' && (github.event.schedule == '40 2 * * *' && 'early' || 'late') || inputs.slot || 'auto' }}
        run: |
          mkdir "$WORK_DIR"
          cd "$WORK_DIR"
          python -m zucai.cloud_feeds "$FEED_MODE" --archive ../cloud-data --days "$LOOKBACK" --slot "$FEED_SLOT" --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Restore and backfill verified history once
        if: ${{ env.FEED_MODE == 'backfill' }}
        env:
          FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_TOKEN }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          BACKFILL_SOURCE: ${{ inputs.source }}
          BACKFILL_LEAGUES: ${{ inputs.leagues }}
          BACKFILL_FROM: ${{ inputs.from_season }}
          BACKFILL_TO: ${{ inputs.to_season }}
        run: |
          mkdir "$WORK_DIR"
          cd "$WORK_DIR"
          args=(--source "${BACKFILL_SOURCE:-fd}")
          if [[ -n "$BACKFILL_LEAGUES" ]]; then args+=(--leagues "$BACKFILL_LEAGUES"); fi
          if [[ -n "$BACKFILL_FROM" ]]; then args+=(--from "$BACKFILL_FROM"); fi
          if [[ -n "$BACKFILL_TO" ]]; then args+=(--to "$BACKFILL_TO"); fi
          python -m zucai.cloud_feeds backfill --archive ../cloud-data --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "${args[@]}"
      - name: Probe API-Football permissions without importing matches
        if: ${{ env.FEED_MODE == 'probe' }}
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          PROBE_LEAGUES: ${{ inputs.leagues }}
          PROBE_SEASONS: ${{ inputs.seasons }}
          PROBE_KIND: ${{ inputs.probe_kind }}
        run: |
          mkdir "$WORK_DIR"
          cd "$WORK_DIR"
          PROBE_SOURCE=apif
          PROBE_KIND=${PROBE_KIND:-seasons}
          if [[ "$PROBE_KIND" == leagues ]]; then
            PROBE_LEAGUES=${PROBE_LEAGUES:-39,140,135,78,61,88,94}
            args=(--probe-kind leagues)
          else
            PROBE_LEAGUES=${PROBE_LEAGUES:-3,848}
            PROBE_SEASONS=${PROBE_SEASONS:-2021-2026}
            args=(--seasons "$PROBE_SEASONS")
          fi
          python -m zucai.cloud_feeds probe --archive ../cloud-data --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --source "$PROBE_SOURCE" --leagues "$PROBE_LEAGUES" "${args[@]}"
      - name: Verify identity-only leagues without importing matches
        if: ${{ env.FEED_MODE == 'identity' }}
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          IDENTITY_LEAGUES: ${{ inputs.leagues }}
          IDENTITY_SEASONS: ${{ inputs.seasons }}
        run: |
          mkdir "$WORK_DIR"
          cd "$WORK_DIR"
          IDENTITY_LEAGUES=${IDENTITY_LEAGUES:-39,140,135,78,61,88,94}
          IDENTITY_SEASONS=${IDENTITY_SEASONS:-2025,2026}
          python -m zucai.cloud_feeds identity --archive ../cloud-data --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --source apif --leagues "$IDENTITY_LEAGUES" --seasons "$IDENTITY_SEASONS"
      - name: Publish verified data
        if: ${{ env.FEED_MODE == 'apis' || env.FEED_MODE == 'backfill' || env.FEED_MODE == 'probe' || env.FEED_MODE == 'identity' }}
        working-directory: cloud-data
        run: bash ../app/scripts/publish-football-feeds.sh
      - name: Keep collection originals and audit even on rebase conflict
        if: ${{ !cancelled() && (env.FEED_MODE == 'apis' || env.FEED_MODE == 'backfill' || env.FEED_MODE == 'probe' || env.FEED_MODE == 'identity') }}
        uses: actions/upload-artifact@v4
        with:
          name: apis-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.WORK_DIR }}/data/raw
            ${{ env.WORK_DIR }}/data/state
            ${{ env.WORK_DIR }}/data/unmatched_teams.csv
          retention-days: 90
          if-no-files-found: ignore

  predict:
    needs: [apis, sporttery]
    if: ${{ !cancelled() && needs.apis.result != 'failure' && ((github.event_name == 'schedule' && github.event.schedule == '40 9 * * *') || (github.event_name == 'workflow_dispatch' && inputs.operation == 'predict')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WORK_DIR: work-predict-${{ github.run_id }}-${{ github.run_attempt }}
      ZUCAI_PARAMS: ${{ github.workspace }}/app/data/model/params.json
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: data/football-feeds
          path: cloud-data
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and existing model extra
        run: python -m pip install -e "./app[model]"
      - name: Train configured leagues and freeze two Beijing days
        env:
          SPORTTERY_STATUS: ${{ needs.sporttery.result }}
        run: |
          mkdir "$WORK_DIR"
          cd "$WORK_DIR"
          python -m zucai.cloud_predict run --archive ../cloud-data --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --sporttery-status "$SPORTTERY_STATUS"
      - name: Publish frozen models and forecasts
        working-directory: cloud-data
        run: bash ../app/scripts/publish-football-feeds.sh
      - name: Keep frozen evidence even on publish conflict
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: forecasts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            cloud-data/models/${{ github.run_id }}-${{ github.run_attempt }}
            cloud-data/models/latest.json
            cloud-data/forecasts/*/${{ github.run_id }}-${{ github.run_attempt }}
            cloud-data/forecast_manifest.json
          retention-days: 90
          if-no-files-found: ignore

  scoreboard:
    needs: [predict]
    # A skipped/failed prediction must not prevent settlement of earlier frozen batches.
    if: ${{ !cancelled() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.operation == 'predict' || inputs.operation == 'scoreboard'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: data/football-feeds
          path: cloud-data
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project for offline scoring
        run: python -m pip install -e ./app
      - name: Restore, score frozen predictions and settle virtual accounts
        run: python -m zucai.scoreboard run --archive cloud-data
      - name: Publish scoreboard
        working-directory: cloud-data
        run: bash ../app/scripts/publish-football-feeds.sh
      - name: Keep scoreboard evidence even on publish conflict
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: scoreboard-${{ github.run_id }}-${{ github.run_attempt }}
          path: cloud-data/scoreboard
          retention-days: 90
          if-no-files-found: ignore

  sporttery:
    needs: apis
    if: ${{ !cancelled() && inputs.operation != 'backfill' && inputs.operation != 'scoreboard' && inputs.operation != 'probe' && inputs.operation != 'identity' && vars.FOOTBALL_FEEDS_RUNNER != '' && (github.event_name == 'schedule' || inputs.operation == 'sync' || startsWith(github.ref_name, 'football-ingest-run-')) }}
    runs-on: ${{ vars.FOOTBALL_FEEDS_RUNNER }}
    timeout-minutes: 60
    env:
      WORK_DIR: work-sporttery-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: data/football-feeds
          path: cloud-data
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Expose Git Bash to the bash steps below
        # Windows runners only put the Git cmd folder on PATH; the runner resolves `shell: bash` from PATH.
        shell: powershell
        run: |
          $git = (Get-Command git).Source
          $bin = Join-Path (Split-Path (Split-Path $git -Parent) -Parent) 'bin'
          if (-not (Test-Path (Join-Path $bin 'bash.exe'))) { throw "Git Bash not found under $bin" }
          Add-Content -Path $env:GITHUB_PATH -Value $bin
      - name: Install project
        shell: bash
        run: python -m pip install -e ./app
      - name: Restore data, collect fixtures and reconcile official results
        env:
          LOOKBACK: ${{ inputs.days || 3 }}
        shell: bash
        run: |
          mkdir "$WORK_DIR"
          cd "$WORK_DIR"
          python -m zucai.cloud_feeds sync --archive ../cloud-data --days "$LOOKBACK" --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Publish verified data
        working-directory: cloud-data
        shell: bash
        run: bash ../app/scripts/publish-football-feeds.sh
      - name: Keep official originals and audit even on rebase conflict
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: sporttery-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.WORK_DIR }}/data/raw
            ${{ env.WORK_DIR }}/data/state
            ${{ env.WORK_DIR }}/data/rejected_results.csv
          retention-days: 90
          if-no-files-found: ignore
