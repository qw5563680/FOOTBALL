name: Football cloud feeds
on:
  schedule:
    - cron: '17 3,10 * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: 'verify 仅校验私有云端归档，sync 则在获准的运行器上采集'
        type: choice
        options: [verify, sync]
        default: verify
      days:
        description: '回看最近几个北京时间自然日'
        type: number
        default: 3
  push:
    tags: ['football-ingest-run-*', 'football-ingest-verify-*']

permissions:
  contents: write
concurrency:
  group: write-football-feed-data
  cancel-in-progress: false

jobs:
  collect:
    if: ${{ startsWith(github.ref_name, 'football-ingest-verify-') || inputs.operation == 'verify' || vars.FOOTBALL_FEEDS_RUNNER != '' }}
    runs-on: ${{ (startsWith(github.ref_name, 'football-ingest-verify-') || inputs.operation == 'verify') && 'ubuntu-latest' || vars.FOOTBALL_FEEDS_RUNNER }}
    env:
      FEED_MODE: ${{ (startsWith(github.ref_name, 'football-ingest-verify-') || inputs.operation == 'verify') && 'verify' || 'sync' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: data/football-feeds
          path: cloud-data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install ./app
      - name: Restore data, fetch current fixtures and reconcile results
        env:
          LOOKBACK: ${{ inputs.days || 3 }}
        run: |
          mkdir -p work
          cd work
          python -m zucai.cloud_feeds "$FEED_MODE" --archive ../cloud-data --days "$LOOKBACK" --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Keep original HTTP responses and observation times
        if: ${{ !cancelled() && env.FEED_MODE == 'sync' }}
        uses: actions/upload-artifact@v4
        with:
          name: sporttery-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/data/raw
            work/data/rejected_results.csv
          retention-days: 90
          if-no-files-found: ignore
      - name: Publish verified data to its private branch
        if: ${{ env.FEED_MODE == 'sync' }}
        working-directory: cloud-data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- state matches feed_manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "Update football feeds from Actions run $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          git push origin HEAD:refs/heads/data/football-feeds
