name: Verify Sunderland Chelsea stats and archive
on:
  push:
    branches: [probe/sunderland-chelsea-fields-20261109]
    paths: ['.github/workflows/verify-sunderland-stats.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read all available player statistic names from the identified match
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          req=urllib.request.Request("https://v3.football.api-sports.io/fixtures/players?fixture=1557466",headers={"x-apisports-key":os.environ["API_FOOTBALL_KEY"]})
          with urllib.request.urlopen(req, timeout=30) as resp: doc=json.load(resp)
          assert not doc["errors"] and str(doc["parameters"]["fixture"])=="1557466"
          assert sorted(r["team"]["name"] for r in doc["response"])==["Chelsea","Sunderland"]
          for r in doc["response"]:
              all_stats=[p["statistics"][0] for p in r["players"] if p.get("statistics")]
              active=[s for s in all_stats if (s["games"]["minutes"] or 0)>0]
              def flat(s):
                  return {(g+"."+k if isinstance(val,dict) else g):v for g,val in s.items() for k,v in (val.items() if isinstance(val,dict) else [("",val)])}
              rows=[flat(s) for s in active]
              fields=sorted(set().union(*(flat(s).keys() for s in all_stats)))
              print("FIELDS",r["team"]["name"],json.dumps(fields))
              for k in fields:
                  if k.startswith(("games.","cards.","penalty.","goals.")): continue
                  v=[s.get(k) for s in rows]; n=[x for x in v if isinstance(x,(int,float)) and not isinstance(x,bool)]
                  print("VALUES",r["team"]["name"],k,len(n),len(rows),sum(n))
          
          PY
